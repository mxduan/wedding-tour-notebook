<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wedding notebook</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#193b32;font:17px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(440px,calc(100% - 40px));padding:36px;background:#fff;border:1px solid #d9ded5;border-radius:14px}h1{font:36px/1.15 Georgia,serif}label{display:block;font-weight:600}input,button{width:100%;font:inherit;border-radius:6px;padding:12px;margin-top:8px}input{border:1px solid #9faea5}button{border:0;background:#234d40;color:white;cursor:pointer}button:disabled{opacity:.6}small{color:#617268}#status{min-height:2em;font-size:14px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f4ee}</style></head><body><main id="gate"><p>W / WEDDING NOTEBOOK</p><h1>A place with the magic.</h1><form id="unlock"><label for="password">Shared password</label><input id="password" type="password" required autocomplete="off" autofocus><button id="submit">Open notebook</button></form><p id="status" role="status" aria-live="polite"></p><small>The notebook is encrypted. The password stays in this browser and is not sent to GitHub. Reload to lock it again.</small></main><script src="unlock-v2.js"></script></body></html>
