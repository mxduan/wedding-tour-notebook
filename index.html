<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wedding notebook</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#193b32;font:17px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(440px,calc(100% - 40px));padding:36px;background:#fff;border:1px solid #d9ded5;border-radius:14px}h1{font:36px/1.15 Georgia,serif}label{display:block;font-weight:600}input,button{width:100%;font:inherit;border-radius:6px;padding:12px;margin-top:8px}input{border:1px solid #9faea5}button{border:0;background:#234d40;color:white;cursor:pointer}button:disabled{opacity:.6}small{color:#617268}#status{min-height:2em;font-size:14px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f4ee}</style></head><body><main id="gate"><p>W / WEDDING NOTEBOOK</p><h1>A place with the magic.</h1><form id="unlock"><label for="password">Shared password</label><input id="password" type="password" required autocomplete="off" autofocus><button id="submit">Open notebook</button></form><p id="status" role="status" aria-live="polite"></p><small>The notebook is encrypted. The password stays in this browser and is not sent to GitHub. Reload to lock it again.</small></main><script>
const status=document.querySelector('#status'),button=document.querySelector('#submit');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let cached;
async function load(){
 const m=await fetch('payload.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Download unavailable');return r.json()});
 const chunks=[];let received=0;
 for(const name of m.chunks){const r=await fetch(name);if(!r.ok)throw Error('Download unavailable');chunks.push(new Uint8Array(await r.arrayBuffer()));received+=chunks.at(-1).length;status.textContent=`Loading photos and notes… ${Math.round(received/m.bytes*100)}%`;}
 const cipher=new Uint8Array(m.bytes);let pos=0;for(const a of chunks){cipher.set(a,pos);pos+=a.length;}
 return {m,cipher};
}
document.querySelector('#unlock').addEventListener('submit',async e=>{
 e.preventDefault();button.disabled=true;status.textContent='Opening notebook…';
 let password=document.querySelector('#password').value;
 try{
  if(!crypto.subtle||!window.DecompressionStream)throw Error('Use a current browser with HTTPS.');
  cached=await(cached||load());const {m,cipher}=cached;
  status.textContent='Checking password…';
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  password='';document.querySelector('#password').value='';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(m.salt),iterations:m.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  let compressed;try{compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(m.iv)},key,cipher);}catch{throw Error('That password did not unlock the notebook. Try again.');}
  const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const frame=document.createElement('iframe');frame.title='Wedding Tour Notebook';frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads');
  frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));document.body.append(frame);document.querySelector('#gate').remove();cached=null;
 }catch(err){status.textContent=err.message;button.disabled=false;}
});
</script></body></html>
